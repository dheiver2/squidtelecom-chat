<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 230" width="200" height="230">
  <defs>
    <clipPath id="topClip">
      <rect x="0" y="0" width="200" height="115"/>
    </clipPath>
    <clipPath id="bottomClip">
      <rect x="0" y="115" width="200" height="115"/>
    </clipPath>
  </defs>

  <!-- Arco superior do S: círculo centrado à direita, visível só na metade superior -->
  <circle cx="115" cy="75" r="55" fill="none" stroke="#E8194A" stroke-width="18" clip-path="url(#topClip)"/>

  <!-- Arco inferior do S: círculo centrado à esquerda, visível só na metade inferior -->
  <circle cx="85" cy="155" r="55" fill="none" stroke="#E8194A" stroke-width="18" clip-path="url(#bottomClip)"/>

  <!-- Barra diagonal roxa (de cima-direita para baixo-esquerda) -->
  <line x1="158" y1="52" x2="42" y2="178" stroke="#7B6FE8" stroke-width="20" stroke-linecap="round"/>
</svg>
