<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <!-- Barra diagonal (roxo vibrante) -->
  <line x1="20" y1="100" x2="100" y2="20" stroke="#635BFF" stroke-width="14" stroke-linecap="round"/>
  
  <!-- Círculo vermelho/carmesim -->
  <circle cx="60" cy="60" r="40" stroke="#DE1B52" stroke-width="12" fill="none"/>
  
  <!-- Cauda superior horizontal -->
  <line x1="60" y1="20" x2="100" y2="20" stroke="#DE1B52" stroke-width="12" stroke-linecap="round"/>
  
  <!-- Cauda inferior horizontal -->
  <line x1="20" y1="100" x2="60" y2="100" stroke="#DE1B52" stroke-width="12" stroke-linecap="round"/>
  
  <!-- Degrau superior da hélice (perpendicular à diagonal) -->
  <line x1="23.55" y1="43.55" x2="50" y2="70" stroke="#DE1B52" stroke-width="12" stroke-linecap="round"/>
  
  <!-- Degrau inferior da hélice (perpendicular à diagonal) -->
  <line x1="70" y1="50" x2="96.45" y2="76.45" stroke="#DE1B52" stroke-width="12" stroke-linecap="round"/>
</svg>
